name: Full Production Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Frontend
        run: npm run build

      - name: Deploy Backend & Frontend
        run: |
          echo "Starting production deployment..."
          ssh user@production-server 'cd /var/www/learning-platform && git pull && npm ci && pm2 restart all'
          echo "Deployment complete."
